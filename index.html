<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القرآن الكريم</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #11998e;
            text-align: center;
            margin-bottom: 15px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            width: 100%;
            margin: 10px 0;
        }

        .btn-quran {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-quran:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-copy {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .quran-box {
            background: linear-gradient(135deg, #e0f7e9 0%, #c8f2d6 100%);
            border-radius: 15px;
            padding: 30px;
            margin-top: 20px;
            border: 3px solid #11998e;
            text-align: center;
        }

        .bismillah {
            font-size: 1.8em;
            color: #11998e;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .ayah-text {
            font-size: 2em;
            color: #1a5f3f;
            margin: 25px 0;
            line-height: 2.5;
            font-weight: bold;
            font-family: 'Traditional Arabic', 'Arial', sans-serif;
        }

        .ayah-decorator {
            color: #11998e;
            font-size: 1.5em;
            margin: 0 10px;
        }

        .ayah-info {
            color: #11998e;
            font-size: 1.3em;
            margin: 15px 0;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            color: #11998e;
            font-style: italic;
            padding: 30px;
        }

        .error {
            background: #ffe6e6;
            color: #d8000c;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            border-right: 5px solid #d8000c;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            animation: fadeIn 0.3s ease-in;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .card {
                padding: 25px;
            }

            .ayah-text {
                font-size: 1.5em;
            }

            .bismillah {
                font-size: 1.4em;
            }

            .ayah-info {
                font-size: 1.1em;
            }

            .ayah-decorator {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>📖 القرآن الكريم</h1>
            <p class="subtitle">احصل على آية عشوائية من كلام الله تعالى</p>
            
            <button class="btn btn-quran" onclick="getRandomAyah()" id="quranBtn">
                ✨ احضر آية قرآنية
            </button>
            
            <div id="quranBox" style="display:none;"></div>
        </div>
    </div>

    <script>
        let currentAyahData = null;

        async function getRandomAyah() {
            const quranBox = document.getElementById('quranBox');
            const btn = document.getElementById('quranBtn');

            btn.disabled = true;
            btn.textContent = '⏳ جاري التحميل...';
            quranBox.style.display = 'block';
            quranBox.innerHTML = '<div class="loading">⏳ جاري جلب الآية الكريمة...</div>';

            try {
                const randomSurah = Math.floor(Math.random() * 114) + 1;
                
                const surahResponse = await fetch(`https://api.alquran.cloud/v1/surah/${randomSurah}`);
                const surahData = await surahResponse.json();
                
                if (surahData.code !== 200) {
                    throw new Error('فشل في جلب بيانات السورة');
                }

                const totalAyahs = surahData.data.numberOfAyahs;
                const randomAyah = Math.floor(Math.random() * totalAyahs) + 1;

                const ayahResponse = await fetch(`https://api.alquran.cloud/v1/ayah/${randomSurah}:${randomAyah}`);
                const ayahData = await ayahResponse.json();

                if (ayahData.code !== 200) {
                    throw new Error('فشل في جلب الآية');
                }

                const ayah = ayahData.data;
                currentAyahData = {
                    text: ayah.text,
                    surahName: ayah.surah.name,
                    ayahNumber: ayah.numberInSurah
                };

                quranBox.innerHTML = `
                    <div class="quran-box">
                        <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
                        <div class="ayah-text">
                            <span class="ayah-decorator">۝</span>
                            ${ayah.text}
                            <span class="ayah-decorator">۝</span>
                        </div>
                        <div class="ayah-info">
                            📖 سورة ${ayah.surah.name}
                        </div>
                        <div class="ayah-info">
                            🔢 رقم الآية: ${ayah.numberInSurah}
                        </div>
                        <button class="btn btn-copy" onclick="copyAyah()">
                            📋 نسخ الآية
                        </button>
                        <button class="btn btn-quran" onclick="getRandomAyah()">
                            🔄 آية أخرى
                        </button>
                    </div>
                `;
            } catch (error) {
                quranBox.innerHTML = `<div class="error">❌ حدث خطأ في جلب الآية: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '✨ احضر آية قرآنية';
            }
        }

        async function copyAyah() {
            if (!currentAyahData) return;

            const textToCopy = `بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ

۝ ${currentAyahData.text} ۝

📖 سورة ${currentAyahData.surahName}
🔢 رقم الآية: ${currentAyahData.ayahNumber}`;

            try {
                await navigator.clipboard.writeText(textToCopy);
                showSuccessMessage();
            } catch (error) {
                fallbackCopy(textToCopy);
            }
        }

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showSuccessMessage();
            } catch (error) {
                alert('فشل النسخ. يرجى نسخ النص يدوياً');
            }
            
            document.body.removeChild(textarea);
        }

        function showSuccessMessage() {
            const quranBox = document.getElementById('quranBox');
            const existingMessage = quranBox.querySelector('.success-message');
            
            if (existingMessage) {
                existingMessage.remove();
            }

            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.textContent = '✅ تم نسخ الآية بنجاح!';
            quranBox.querySelector('.quran-box').appendChild(successDiv);

            setTimeout(() => {
                successDiv.remove();
            }, 3000);
        }
    </script>
</body>
</html>
